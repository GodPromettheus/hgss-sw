name: Windows Switch builder

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/switch/windows_builder.py"
      - ".github/workflows/windows-switch-builder.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package the GUI
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name HGSS-SW-Builder tools/switch/windows_builder.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: HGSS-SW-Builder-Windows
          path: dist/HGSS-SW-Builder.exe
          if-no-files-found: error
          retention-days: 14
